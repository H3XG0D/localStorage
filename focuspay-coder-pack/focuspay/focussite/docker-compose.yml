name: focuspay-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB via --env-file .env.docker}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER via --env-file .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via --env-file .env.docker}
    volumes:
      - focuspay_local_db:/var/lib/postgresql/data
      # Local schema dump is a host-only artifact and is never copied into an image.
      - type: bind
        source: ${FOCUSPAY_DB_SEED_DUMP:-./focuspay-main-site/tmp/focuspay-main-backup-20260804-044406/db/exchange_bot.dump}
        target: /seed/exchange_bot.dump
        read_only: true
      - type: bind
        source: ./docker/postgres/01-schema.sh
        target: /docker-entrypoint-initdb.d/01-schema.sh
        read_only: true
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    user: "999:999"
    expose:
      - "6379"
    volumes:
      - focuspay_local_redis:/data
    networks:
      - app_net
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: focussite/docker/backend.Dockerfile
    env_file:
      - ${FOCUSPAY_DOCKER_ENV_FILE:-.env.docker.example}
    command: ["python", "/runtime/run_backend.py"]
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge_net
      - app_net
    volumes:
      - focuspay_local_receipts:/opt/tg_bot_btc/receipts
      - focuspay_local_chat_uploads:/opt/tg_bot_btc/chat_uploads
      - focuspay_local_bot_user_avatars:/opt/tg_bot_btc/bot_user_avatars
      - focuspay_local_operator_avatars:/opt/tg_bot_btc/operator_avatars
      - focuspay_local_logs:/var/log/focuspay
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "from urllib.request import urlopen;
          response = urlopen('http://127.0.0.1:8000/api/health', timeout=3);
          raise SystemExit(0 if response.status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: focussite/docker/bot.Dockerfile
    env_file:
      - ${FOCUSPAY_DOCKER_ENV_FILE:-.env.docker.example}
    command: ["python", "main.py"]
    expose:
      - "8082"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge_net
      - app_net
    volumes:
      - focuspay_local_receipts:/opt/tg_bot_btc/receipts
      - focuspay_local_chat_uploads:/opt/tg_bot_btc/chat_uploads
      - focuspay_local_bot_data:/opt/tg_bot_btc/data
      - focuspay_local_bot_user_avatars:/opt/tg_bot_btc/bot_user_avatars
      - focuspay_local_operator_avatars:/opt/tg_bot_btc/operator_avatars
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  bot-webhook:
    build:
      context: ..
      dockerfile: focussite/docker/bot.Dockerfile
    env_file:
      - ${FOCUSPAY_DOCKER_ENV_FILE:-.env.docker.example}
    command:
      - python
      - -m
      - uvicorn
      - services.webhook_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --no-server-header
      - --limit-concurrency
      - "50"
    expose:
      - "8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge_net
      - app_net
    volumes:
      - focuspay_local_receipts:/opt/tg_bot_btc/receipts
      - focuspay_local_chat_uploads:/opt/tg_bot_btc/chat_uploads
      - focuspay_local_bot_user_avatars:/opt/tg_bot_btc/bot_user_avatars
      - focuspay_local_operator_avatars:/opt/tg_bot_btc/operator_avatars
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "from urllib.request import urlopen;
          response = urlopen('http://127.0.0.1:8081/health', timeout=3);
          raise SystemExit(0 if response.status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:${FOCUSPAY_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
      bot-webhook:
        condition: service_healthy
    networks:
      - edge_net
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /var/cache/nginx:uid=101,gid=101,mode=0755,size=64m
      - /var/run:mode=0755,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

networks:
  # Only the gateway has a host-published entrypoint; application services have no host ports.
  edge_net:
  # No service publishes a port from this network; it is used for DB and egress.
  app_net:

volumes:
  focuspay_local_db:
  focuspay_local_redis:
  focuspay_local_receipts:
  focuspay_local_chat_uploads:
  focuspay_local_bot_data:
  focuspay_local_bot_user_avatars:
  focuspay_local_operator_avatars:
  focuspay_local_logs:
