name: focuspay-staging-runtime

x-runtime-env: &runtime-env
  - path: ${STAGING_RUNTIME_ENV_FILE:-.env.staging-runtime}
    required: true

x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17-alpine
    env_file: *runtime-env
    volumes:
      - focuspay_staging_runtime_postgres:/var/lib/postgresql/data
    networks:
      - app_net
    tmpfs:
      - /tmp:mode=1777,size=32m
      - /var/run/postgresql:uid=70,gid=70,mode=0775,size=8m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    user: "999:999"
    volumes:
      - focuspay_staging_runtime_redis:/data
    networks:
      - app_net
    <<: *hardening
    tmpfs:
      - /tmp:mode=1777,size=32m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  fake-payfast:
    build:
      context: ..
      dockerfile: focussite/docker/backend.Dockerfile
    env_file: *runtime-env
    command: ["python", "/app/test_support/fake_payfast_server.py"]
    networks:
      - app_net
    <<: *hardening
    tmpfs:
      - /tmp:mode=1777,size=32m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8081/health', timeout=3); raise SystemExit(0 if response.status == 200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  staging-bootstrap:
    build:
      context: ..
      dockerfile: focussite/docker/backend.Dockerfile
    env_file: *runtime-env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.staging-runtime}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env.staging-runtime}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.staging-runtime}
      MIGRATIONS_DIR: /migrations
      BOT_MIGRATIONS_DIR: /bot-migrations
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "/bootstrap/10-bootstrap-dispatch.sh"]
    networks:
      - app_net
    volumes:
      - ./docker/staging-db:/bootstrap:ro
      - ../site/exchange-backend/migrations:/migrations:ro
      - ../bot/tg_bot_btc/migrations:/bot-migrations:ro
    <<: *hardening
    tmpfs:
      - /tmp:mode=1777,size=32m
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: focussite/docker/backend.Dockerfile
    env_file: *runtime-env
    environment:
      CASINO_BOT_USERNAME: ${CASINO_STAGING_TELEGRAM_BOT_USERNAME:?Set CASINO_STAGING_TELEGRAM_BOT_USERNAME}
    command: ["python", "/runtime/run_backend.py"]
    depends_on:
      staging-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fake-payfast:
        condition: service_healthy
    networks:
      - edge_net
      - app_net
    volumes:
      - focuspay_staging_runtime_receipts:/opt/tg_bot_btc/receipts
      - focuspay_staging_runtime_chat_uploads:/opt/tg_bot_btc/chat_uploads
      - focuspay_staging_runtime_bot_user_avatars:/opt/tg_bot_btc/bot_user_avatars
      - focuspay_staging_runtime_operator_avatars:/opt/tg_bot_btc/operator_avatars
      - focuspay_staging_runtime_logs:/var/log/focuspay
    <<: *hardening
    tmpfs:
      - /tmp:mode=1777,size=128m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/api/health', timeout=3); raise SystemExit(0 if response.status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:${STAGING_RUNTIME_HTTP_PORT:-18080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge_net
    volumes:
      - ./docker/nginx.staging-runtime.conf:/etc/nginx/conf.d/default.conf:ro
    <<: *hardening
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /var/cache/nginx:mode=1777,size=64m
      - /var/run:mode=0755,size=8m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  bot:
    profiles: ["bot"]
    build:
      context: ..
      dockerfile: focussite/docker/bot.Dockerfile
    env_file: *runtime-env
    command: ["sh", "-ec", "test \"$$STAGING_RUNTIME_ENABLE_BOT\" = 1 || { echo 'Set STAGING_RUNTIME_ENABLE_BOT=1 for the bot profile' >&2; exit 64; }; exec python main.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge_net
      - app_net
    volumes:
      - focuspay_staging_runtime_receipts:/opt/tg_bot_btc/receipts
      - focuspay_staging_runtime_chat_uploads:/opt/tg_bot_btc/chat_uploads
      - focuspay_staging_runtime_bot_data:/opt/tg_bot_btc/data
      - focuspay_staging_runtime_bot_user_avatars:/opt/tg_bot_btc/bot_user_avatars
      - focuspay_staging_runtime_operator_avatars:/opt/tg_bot_btc/operator_avatars
    <<: *hardening
    tmpfs:
      - /tmp:mode=1777,size=128m
    restart: unless-stopped

  backend-tests:
    profiles: ["tests"]
    build:
      context: ..
      dockerfile: focussite/docker/backend-tests.Dockerfile
    env_file: *runtime-env
    working_dir: /opt/focuspay/site/exchange-backend
    volumes:
      - ..:/opt/focuspay:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=128m
    restart: "no"

  casino-bot:
    profiles: ["casino"]
    build:
      context: ../../focuspay-casino
      dockerfile: ../focuspay/focussite/docker/casino-bot-runtime.Dockerfile
    env_file: *runtime-env
    command: ["sh", "-ec", "test \"$$STAGING_RUNTIME_ENABLE_CASINO\" = 1 || { echo 'Set STAGING_RUNTIME_ENABLE_CASINO=1 for the casino profile' >&2; exit 64; }; exec python bot.py"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge_net
      - app_net
    <<: *hardening
    environment:
      CASINO_CARD_WORKDIR: /tmp/casino-card
      CASINO_FAIRNESS_URL: ${CASINO_FAIRNESS_URL:-http://127.0.0.1:18081/casino/fairness}
      DEPOSITS_ENABLED: "1"
    tmpfs:
      - /tmp:mode=1777,size=256m
    restart: unless-stopped

networks:
  edge_net:
    name: focuspay_staging_runtime_edge_net
  app_net:
    name: focuspay_staging_runtime_app_net
    internal: true

volumes:
  focuspay_staging_runtime_postgres:
    name: ${STAGING_RUNTIME_POSTGRES_VOLUME:?Set STAGING_RUNTIME_POSTGRES_VOLUME in .env.staging-runtime}
  focuspay_staging_runtime_redis:
    name: focuspay_staging_runtime_redis
  focuspay_staging_runtime_receipts:
    name: focuspay_staging_runtime_receipts
  focuspay_staging_runtime_chat_uploads:
    name: focuspay_staging_runtime_chat_uploads
  focuspay_staging_runtime_bot_data:
    name: focuspay_staging_runtime_bot_data
  focuspay_staging_runtime_bot_user_avatars:
    name: focuspay_staging_runtime_bot_user_avatars
  focuspay_staging_runtime_operator_avatars:
    name: focuspay_staging_runtime_operator_avatars
  focuspay_staging_runtime_logs:
    name: focuspay_staging_runtime_logs
