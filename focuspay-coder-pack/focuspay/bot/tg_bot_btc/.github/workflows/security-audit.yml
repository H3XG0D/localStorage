name: security-audit

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  pip-audit-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict --desc on

  pip-audit-exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exchange backend
        run: |
          if [ -d ../exchange/backend ]; then
            echo "EXCHANGE_BACKEND=../exchange/backend" >> $GITHUB_ENV
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: |
          if [ -f ../exchange/backend/requirements.txt ]; then
            pip-audit -r ../exchange/backend/requirements.txt --strict --desc on
          else
            echo "exchange backend not in repo — skip"
          fi
