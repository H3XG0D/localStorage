# Tor v3 hidden service for Doliv / traders.focuspay.org
# Tor: HiddenServicePort 80 127.0.0.1:9081
# Origin is the same Hetzner box as the clearnet traders vhost.

upstream traders_onion_origin {
    server 178.63.247.233:443;
    keepalive 16;
}

server {
    listen 127.0.0.1:9081;
    listen 127.0.0.1:9444 ssl;
    server_name _;

    ssl_certificate /etc/nginx/onion-certs/doliv.crt;
    ssl_certificate_key /etc/nginx/onion-certs/doliv.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        limit_req zone=onion_api_limit burst=40 nodelay;
        proxy_pass https://traders_onion_origin;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name traders.focuspay.org;
        proxy_ssl_session_reuse on;
        proxy_set_header Host traders.focuspay.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cookie_domain traders.focuspay.org $host;
        proxy_redirect https://traders.focuspay.org/ /;
        proxy_redirect https://traders.focuspay.org /;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
