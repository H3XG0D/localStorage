# /etc/fail2ban/filter.d/nginx-focuspay.conf
[Definition]
failregex = ^<HOST> -.*"(GET|POST|PUT|DELETE|PATCH) /api/.*" (401|403|429) 
            ^<HOST> -.*"(GET|POST) /callback.*" (401|403) 
# Session probes: public SPA always GET /api/auth/me (401 if not a buyer).
# Counting those as nginx-focuspay bans the owner while they use /x8.
ignoreregex = ^<HOST> -.*"GET /api/auth/(?:me|admin/me|operator/me|partner/me|exchanger/me|telegram/bot-wait)
