# Скопировать в /etc/fail2ban/jail.d/focuspay.conf
# Требует: apt install fail2ban, лог nginx access.log

[nginx-focuspay]
enabled = true
port = http,https
filter = nginx-focuspay
logpath = /var/log/nginx/access.log
maxretry = 25
findtime = 300
bantime = 3600
# Owner office: persist also in /etc/fail2ban/jail.local DEFAULT ignoreip
# ignoreip = 127.0.0.1/8 ::1 217.60.34.122 2403:6200:8871:6a71::/64
