# Optional Postgres + Redis on the CP host (Launch-L1).
# Prefer managed DB when available. Change passwords before use.
name: focusvpn-launch-cp

services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: focusvpn
      POSTGRES_PASSWORD: ${FOCUSVPN_PG_PASSWORD:?set FOCUSVPN_PG_PASSWORD}
      POSTGRES_DB: focusvpn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - focusvpn_launch_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusvpn -d focusvpn"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - focusvpn_launch_redis:/data
    restart: unless-stopped

volumes:
  focusvpn_launch_pg:
  focusvpn_launch_redis:
