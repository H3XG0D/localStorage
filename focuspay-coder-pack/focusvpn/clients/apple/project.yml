name: FocusVPN
options:
  bundleIdPrefix: com.focusvpn
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0-p3m4c"
targets:
  FocusVPN:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    dependencies:
      - target: FocusVPNTunnel
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusvpn.app
        PRODUCT_NAME: FocusVPN
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FocusVPN
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: FocusVPN talks to your control plane on the LAN.
    scheme:
      testTargets:
        - FocusVPNTests

  FocusVPNTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Tunnel
      - path: Sources/Shared/TunnelConfig.swift
      - path: Sources/Shared/AwgConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusvpn.app.tunnel
        PRODUCT_NAME: FocusVPNTunnel
        CODE_SIGN_ENTITLEMENTS: Config/Tunnel.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FocusVPN Tunnel
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    info:
      path: Config/Tunnel-Info.plist
      properties:
        CFBundleDisplayName: FocusVPN Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider

  FocusVPNMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    dependencies:
      - target: FocusVPNTunnelMac
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusvpn.app
        PRODUCT_NAME: FocusVPN
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FocusVPN
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright FocusVPN
        MACOSX_DEPLOYMENT_TARGET: "13.0"

  FocusVPNTunnelMac:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Tunnel
      - path: Sources/Shared/TunnelConfig.swift
      - path: Sources/Shared/AwgConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusvpn.app.tunnel
        PRODUCT_NAME: FocusVPNTunnel
        CODE_SIGN_ENTITLEMENTS: Config/Tunnel.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    info:
      path: Config/Tunnel-Info.plist
      properties:
        CFBundleDisplayName: FocusVPN Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider

  FocusVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FocusVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusvpn.app.tests
        GENERATE_INFOPLIST_FILE: YES
